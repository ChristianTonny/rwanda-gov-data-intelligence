name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm install -g pnpm && pnpm install
      - name: Typecheck
        run: pnpm -w tsc -v || true
      - name: Lint
        run: pnpm -w lint || true
      - name: Build web
        run: pnpm build:web || true

